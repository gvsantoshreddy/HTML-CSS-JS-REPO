<!DOCTYPE html>
<html><body>
<form id="form">
<input id="name" placeholder="Name" required><br>
<input id="email" type="email" placeholder="Email" required><br>
<input id="phone" placeholder="Phone" required><br>
<input id="password" type="password" placeholder="Password" required><br>
<button>Submit</button>
</form>
<p id="msg"></p>
<script>
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const emailOK = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const phoneOK = /^\d{10}$/.test(phone);
  if (!name || !emailOK || !phoneOK || password.length < 6)
    document.getElementById("msg").textContent = "Please enter valid details.";
  else document.getElementById("msg").textContent = "Form submitted successfully!";
});
</script>
</body></html>
