<!DOCTYPE html>
<html><body>
<h2>API Data</h2><pre id="data">Loading...</pre>
<script>
fetch("https://jsonplaceholder.typicode.com/posts/1")
  .then(response => response.json())
  .then(data => {
    document.getElementById("data").textContent =
      JSON.stringify(data, null, 2);
  })
  .catch(error => document.getElementById("data").textContent = error);
</script>
</body></html>
