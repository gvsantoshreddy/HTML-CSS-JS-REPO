<!DOCTYPE html>
<html><body>
<h2>4. Change Multiple Elements</h2>
<p class="text">First paragraph</p>
<p class="text">Second paragraph</p>
<p class="text">Third paragraph</p>
<button onclick="changeAll()">Change All</button>
<script>
function changeAll() {
  document.querySelectorAll(".text").forEach((element, index) => {
    element.textContent = "Updated paragraph " + (index + 1);
    element.style.color = "green";
    element.style.fontWeight = "bold";
  });
}
</script>
</body></html>
