<!DOCTYPE html>
<html><body>
<h2 id="heading">getElementById()</h2>
<p class="demo">Paragraph 1</p>
<p class="demo">Paragraph 2</p>
<button onclick="demonstrate()">Run</button>
<script>
function demonstrate() {
  const heading = document.getElementById("heading");
  heading.textContent = "Found using getElementById()";

  const elements = document.getElementsByClassName("demo");
  for (let i = 0; i < elements.length; i++) {
    elements[i].style.color = "blue";
  }
}
</script>
</body></html>
