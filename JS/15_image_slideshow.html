<!DOCTYPE html>
<html><head>
<style>
#slide { width: 500px; max-width: 100%; height: 300px; object-fit: cover; }
button { margin: 8px; padding: 8px 15px; }
</style>
</head><body>
<h2>15. Image Slideshow / Carousel</h2>
<img id="slide" src="https://picsum.photos/id/1015/500/300" alt="Slideshow image">
<br>
<button onclick="previous()">Previous</button>
<button onclick="next()">Next</button>
<script>
const images = [
  "https://picsum.photos/id/1015/500/300",
  "https://picsum.photos/id/1016/500/300",
  "https://picsum.photos/id/1025/500/300",
  "https://picsum.photos/id/1035/500/300"
];
let index = 0;

function showImage() {
  document.getElementById("slide").src = images[index];
}
function next() {
  index = (index + 1) % images.length;
  showImage();
}
function previous() {
  index = (index - 1 + images.length) % images.length;
  showImage();
}

setInterval(next, 3000);
</script>
</body></html>
