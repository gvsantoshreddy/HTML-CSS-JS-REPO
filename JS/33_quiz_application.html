<!DOCTYPE html>
<html><body>
<h2 id="question"></h2>
<div id="options"></div><p id="score"></p>
<script>
const quiz = [
  {q:"Which keyword declares a constant?", options:["var","let","const","define"], answer:"const"},
  {q:"Which method converts JSON text to an object?", options:["JSON.parse","JSON.stringify","JSON.object","JSON.convert"], answer:"JSON.parse"}
];
let i = 0, score = 0;
function showQuestion() {
  const item = quiz[i];
  document.getElementById("question").textContent = item.q;
  document.getElementById("options").innerHTML = item.options.map(o =>
    `<button onclick="answer('${o}')">${o}</button> `).join("");
}
function answer(choice) {
  if (choice === quiz[i].answer) score++;
  i++;
  if (i < quiz.length) showQuestion();
  else document.getElementById("score").textContent = `Score: ${score}/${quiz.length}`;
}
showQuestion();
</script>
</body></html>
